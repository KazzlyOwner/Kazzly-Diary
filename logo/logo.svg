<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Kazzly Diary</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e2e32"/><stop offset="1" stop-color="#050505"/></linearGradient>
<linearGradient id="kfill" gradientUnits="userSpaceOnUse" x1="0" y1="48" x2="0" y2="152"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b4b4ba"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/></linearGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
<clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<circle cx="256" cy="256" r="130" fill="#ffffff" opacity="0.12" filter="url(#blur)"/>
<rect x="96" y="96" width="320" height="320" rx="82" fill="#ffffff" fill-opacity="0.07" stroke="url(#rim)" stroke-width="2"/>
<g transform="translate(256 270) scale(2.4) translate(-108 -100)" fill="#000000" opacity="0.55" filter="url(#soft)"><path d="M62,48 H84 V104 L124,48 H152 L110.6,106 L152,152 H124 L84,107.6 V152 H62 Z"/></g>
<g transform="translate(256 256) scale(2.4) translate(-108 -100)" fill="url(#kfill)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="0.6"><path d="M62,48 H84 V104 L124,48 H152 L110.6,106 L152,152 H124 L84,107.6 V152 H62 Z"/></g>
<g clip-path="url(#tile)"><path d="M0,0 H512 V190 Q256,260 0,190 Z" fill="url(#gloss)"/></g>
<rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
